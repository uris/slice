<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Slice UI components for React and React Native.">
  <title>Slice UIKit</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #101918; color: #f2f7f5; }
    main { max-width: 42rem; padding: 3rem 1.5rem; }
    h1 { font-size: clamp(3rem, 9vw, 5rem); letter-spacing: -.06em; margin: 0; }
    p { line-height: 1.6; color: #baccc6; }
    nav { display: flex; flex-wrap: wrap; gap: 1rem; margin-top: 2rem; }
    a { display: inline-block; padding: 1rem 1.5rem; border-radius: 999px; background: #a7efcc; color: #10271c; font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 5px; }
    a:hover { background: #c8f8df; }
  </style>
</head>
<body>
  <main>
    <h1>Slice UIKit</h1>
    <p>Components, themes, and utilities for building interfaces with React and React Native.</p>
    <nav aria-label="Platform documentation">
      <a href="https://react.slice-uikit.com">React documentation</a>
      <a href="https://react-native.slice-uikit.com">React Native documentation</a>
    </nav>
  </main>
</body>
</html>
