# Merge these service definitions into ~/projects/docker-compose.yml on the VM.
# Relative contexts assume that file lives alongside the uikit checkout.
services:
  uikit:
    build:
      context: ./uikit
      target: landing
    container_name: uikit
    ports:
      - "127.0.0.1:8090:80"
    restart: unless-stopped

  uikit-react:
    build:
      context: ./uikit
      target: react-docs
    container_name: uikit-react
    ports:
      - "127.0.0.1:8091:80"
    restart: unless-stopped

  uikit-native:
    build:
      context: ./uikit
      dockerfile: Dockerfile.react-native
      target: react-native-docs
    container_name: uikit-native
    ports:
      - "127.0.0.1:8092:80"
    restart: unless-stopped
