name: Deploy Slice UIKit Sites

on:
  push:
    branches:
      - main

concurrency:
  group: slice-sites-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            export GIT_SSH_COMMAND='ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=yes'

            if [ -d ~/projects/uikit/.git ]; then
              git -C ~/projects/uikit pull --ff-only origin main
            else
              git clone git@github.com:uris/uikit.git ~/projects/uikit
            fi

            cd ~/projects
            if docker compose version >/dev/null 2>&1; then
              compose() { docker compose -f "$HOME/projects/docker-compose.yml" "$@"; }
            else
              compose() { docker-compose -f "$HOME/projects/docker-compose.yml" "$@"; }
            fi

            configured=$(compose config --services)
            services=()
            for service in uikit uikit-react uikit-native; do
              if printf '%s\n' "$configured" | grep -Fxq "$service"; then
                services+=("$service")
              fi
            done
            if [ "${#services[@]}" -eq 0 ]; then
              echo "No Slice services found in ~/projects/docker-compose.yml" >&2
              exit 1
            fi

            # Build every selected image before replacing any running site.
            compose build "${services[@]}"
            compose up -d --no-deps --no-build "${services[@]}"
            compose ps "${services[@]}"
            DEPLOY
