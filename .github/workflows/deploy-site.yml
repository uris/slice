name: Deploy Slice UIKit Sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice-sites-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate documentation builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native/package-lock.json
      - run: npm ci
      - run: npm ci --prefix native
      - run: npm run lint:ci
      - run: npm run lint:ci --prefix native
      - run: npm run typecheck:storybook:native
      - run: npm test --prefix native
      - name: Test deployment orchestration
        run: python3 deployment/test_deploy.py
      - name: Build React documentation
        run: npm run build-storybook
      - name: Build React Native documentation
        run: npm run build-storybook:native

  deploy:
    name: Deploy all three sites
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy validated commit to VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 35m
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=yes'
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

            if [ ! -d ~/projects/uikit/.git ]; then
              git clone git@github.com:uris/uikit.git ~/projects/uikit
            fi
            cd ~/projects/uikit
            if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
              echo "VM checkout contains local changes; commit or move them before deploying." >&2
              exit 1
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Skipping superseded deployment: main has advanced beyond $DEPLOY_SHA."
              exit 0
            fi
            git checkout --detach "$DEPLOY_SHA"
            bash deployment/deploy-sites.sh "$HOME/projects/docker-compose.yml"
            DEPLOY
