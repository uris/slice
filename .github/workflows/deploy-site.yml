name: Deploy Slice Site
run-name: Deploy ${{ inputs.site }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to deploy
        type: choice
        required: true
        default: website
        options:
          - website
          - web-docs
          - native-docs

permissions:
  contents: read

concurrency:
  group: slice-sites-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate selected site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Deployments must run from main after the PR has been merged.' >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test --workspace=@apple-pie/slice-native
      - name: Build selected site
        env:
          DEPLOY_SITE: ${{ inputs.site }}
        run: |
          case "$DEPLOY_SITE" in
            website) npm run build:landing ;;
            web-docs) npm run build-storybook ;;
            native-docs) npm run build-storybook:native ;;
            *) echo "Unknown site: $DEPLOY_SITE" >&2; exit 1 ;;
          esac

  deploy:
    name: Deploy selected site
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Deploy validated commit to VM
        uses: appleboy/ssh-action@v1.0.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_SITE: ${{ inputs.site }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA,DEPLOY_SITE
          command_timeout: 35m
          script: |
            bash -se <<'DEPLOY'
            set -euo pipefail
            export GIT_SSH_COMMAND='ssh -i ~/.ssh/github_actions -o StrictHostKeyChecking=yes'
            [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1

            if [ ! -d ~/projects/uikit/.git ]; then
              git clone git@github.com:uris/uikit.git ~/projects/uikit
            fi
            cd ~/projects/uikit
            if [ -n "$(git status --porcelain --untracked-files=normal)" ]; then
              echo "VM checkout contains local changes; commit or move them before deploying." >&2
              exit 1
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Main has advanced beyond $DEPLOY_SHA. Run the deployment again from main." >&2
              exit 1
            fi
            git checkout --detach "$DEPLOY_SHA"
            bash deployment/deploy-sites.sh "$HOME/projects/docker-compose.yml" "$DEPLOY_SITE"
            DEPLOY
