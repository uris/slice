name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Slice Native Lint, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match local tooling and the Node requirement of postcss-nested.
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repository tooling
        run: npm ci
      - name: Lint and typecheck
        run: npm run lint:ci --workspace=@apple-pie/slice-native
      - name: Run native tests with coverage thresholds
        run: npm run coverage --workspace=@apple-pie/slice-native
      - name: Typecheck native Storybook
        run: npm run typecheck:storybook:native
      - name: Build native Storybook
        run: npm run build-storybook:native
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium for native icon generation
        run: npx playwright install --with-deps chromium
      - name: Build native package
        run: npm run build --workspace=@apple-pie/slice-native
      - name: Verify native exports and Codegen specification
        run: node packages/slice-native/scripts/check-package.mjs
      - name: Validate native package contents
        working-directory: packages/slice-native
        # The preceding step already built the package; avoid repeating prepack.
        run: npm pack --dry-run --ignore-scripts

  lint:
    name: Slice Web Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Test deployment selection and failure handling
        run: python3 deployment/tests/test_deploy_sites.py
      - run: npm ci
      - run: npm run lint:ci

  test:
    name: Slice Web Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run unit + Storybook tests with coverage
        run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/slice/reports/coverage/
          retention-days: 14

  build:
    name: Slice Web Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run --workspace=@apple-pie/slice
      - name: Build Next.js website
        run: npm run build:landing
      - name: Build web Storybook
        run: npm run build-storybook
